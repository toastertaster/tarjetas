name: Test and deploy

# Tests (unit and rendering) run on every pull request and push. Pushes to
# main that pass them are published to GitHub Pages (repo Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests and content checks
        run: node --test

  # How the pages render, in Chromium and WebKit (Safari's engine), desktop
  # and phone sizes: layout rules plus screenshots compared with the approved
  # ones in tests/visual/snapshots. The pinned Playwright container keeps the
  # fonts, and so the screenshots, identical from run to run.
  render:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Rendering tests
        run: npx playwright test
      # On failure: the report shows expected / actual / diff for every
      # screenshot, and visual-snapshots holds a complete new set to commit
      # if the change was intended (README, "Rendering tests").
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rendering-report
          path: playwright-report
      - name: Make new screenshots for review
        if: failure()
        run: npx playwright test tests/visual/screens.spec.js --update-snapshots --reporter=list || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-snapshots
          path: tests/visual/snapshots

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, render]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site (only what the browser needs)
        run: |
          mkdir _site
          cp -r index.html css js data img _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
